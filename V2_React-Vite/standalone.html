    // --- Particle Canvas React Component ---
    function ParticleCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();

        const particles = [];
        const mouse = { x: null, y: null, radius: 150 };

        const handleResize = () => { resize(); };
        const handleMouseMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
        const handleMouseLeave = () => { mouse.x = null; mouse.y = null; };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const count = Math.min(Math.max(Math.floor((canvas.width * canvas.height) / 14000), 40), 90);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.75,
            vy: (Math.random() - 0.5) * 0.75,
            radius: Math.random() * 2 + 1,
            color: Math.random() > 0.5 ? '#38bdf8' : '#818cf8',
            pulse: Math.random() * Math.PI,
            pulseSpeed: 0.02 + Math.random() * 0.02
          });
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (1 - dist / mouse.radius) * 1.5;
                p.x -= (dx / dist) * force;
                p.y -= (dy / dist) * force;
              }
            }

            p.pulse += p.pulseSpeed;
            const currentRadius = p.radius + Math.sin(p.pulse) * 0.5;

            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, currentRadius), 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 130) {
                const alpha = (1 - dist / 130) * 0.25;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          animId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

    // --- Typing Headline Hook ---
    function useTypingHeadline(words) {
      const [text, setText] = useState('');
      const [wordIndex, setWordIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        const currentWord = words[wordIndex];
        const speed = isDeleting ? 40 : 85;

        const timer = setTimeout(() => {
          if (!isDeleting && text === currentWord) {
            setTimeout(() => setIsDeleting(true), 1700);
          } else if (isDeleting && text === '') {
            setIsDeleting(false);
            setWordIndex((prev) => (prev + 1) % words.length);
          } else {
            setText(currentWord.substring(0, isDeleting ? text.length - 1 : text.length + 1));
          }
        }, speed);

        return () => clearTimeout(timer);
      }, [text, isDeleting, wordIndex, words]);

      return text;
    }

            <section id="contact" className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
              <div className="glass-panel p-10 rounded-3xl text-center max-w-3xl mx-auto space-y-6">
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white font-display">Let's Connect</h2>
                <p className="text-slate-400 text-sm">skmd.aarif5391@gmail.com • +91 99102 24613</p>
                <div className="flex justify-center gap-4">
                  <a href="https://github.com/skmdaarif" target="_blank" className="px-6 py-3 rounded-xl bg-slate-900 text-white hover:text-cyan-400 border border-slate-800">
                    GitHub Profile
                  </a>
                  <a href="https://linkedin.com/in/sheikh-md-aarif-al-zubair-a290b337a" target="_blank" className="px-6 py-3 rounded-xl bg-slate-900 text-white hover:text-cyan-400 border border-slate-800">
                    LinkedIn Profile
                  </a>
                </div>
              </div>
            </section>

          </main>

          {/* Project Deep Dive Modal */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setSelectedProject(null)}>
              <div className="glass-panel max-w-2xl w-full p-8 rounded-3xl space-y-6 glow-box" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-start border-b border-slate-800 pb-4">
                  <div>
                    <span className="px-2.5 py-0.5 text-xs font-mono rounded bg-cyan-500/20 text-cyan-300">{selectedProject.badge}</span>
                    <h3 className="text-2xl font-bold font-display text-white mt-1">{selectedProject.title}</h3>
                  </div>
                  <button onClick={() => setSelectedProject(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <p className="text-sm text-slate-300 leading-relaxed">{selectedProject.overview}</p>
                <ul className="space-y-2 text-xs text-slate-300 font-mono">
                  {selectedProject.features.map((f, i) => (
                    <li key={i} className="flex items-start gap-2">
                      <span className="text-cyan-400">▹</span>
                      <span>{f}</span>
                    </li>
                  ))}
                </ul>
                <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                  {selectedProject.githubUrl && (
                    <a href={selectedProject.githubUrl} target="_blank" className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs font-mono flex items-center gap-2 border border-slate-700">
                      <i className="fa-brands fa-github"></i>
                      <span>GitHub Repo</span>
                    </a>
                  )}
                  <button onClick={() => setSelectedProject(null)} className="px-5 py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs font-mono">
                    Close Specs
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
